<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Minding</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='20' cy='16' r='9' fill='%23000'/><circle cx='20' cy='48' r='9' fill='%23000'/><circle cx='44' cy='16' r='9' fill='%23000'/><circle cx='44' cy='48' r='9' fill='%23000'/><rect x='20' y='14' width='24' height='36' fill='%23000'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="app-header">
    <span class="logo">Dog Minding</span>
    <button id="btn-logout" class="btn btn-small">Logout</button>
  </header>
  <main id="app-main"><div class="loading">Loading...</div></main>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn">Cancel</button>
        <button id="modal-confirm" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>
  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" src="" alt="">
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dogs.js"></script>
  <script src="/js/bookings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
